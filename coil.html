<head>

<style>
  :root{
    --void:#06080a;
    --chrome:#0d1216;
    --edge:#233139;
    --ink:#dfe3e4;
    --dim:#7d888e;
    --glow:#dcae52;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--ink); overflow:hidden;
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none}

  /* Titeln ligger uppe till hoger sa den aldrig krockar med panelen. */
  #title{
    position:fixed; z-index:3; top:16px; right:20px; text-align:right;
    pointer-events:none; user-select:none;
  }
  #title h1{
    margin:0; font:700 15px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.34em; text-transform:uppercase; color:var(--glow);
  }
  #title p{
    margin:7px 0 0; font:11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.22em; text-transform:uppercase; color:var(--dim);
  }
  #title a{color:var(--dim); text-decoration:none; pointer-events:auto}
  #title a:hover{color:var(--glow)}

  /* Panelen dockas till vanster. Motivet star i mitten, sa mitt over bilden
     ar den enda plats den inte far sta. Samma lardom som i Tendril. */
  #panel{
    position:fixed; z-index:4; left:12px; right:auto;
    top:76px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    width:318px; max-width:calc(100vw - 24px); margin:0;
    background:color-mix(in srgb, var(--chrome) 96%, transparent);
    border:1px solid var(--edge); border-radius:16px;
    backdrop-filter:blur(10px); padding:16px 16px 18px;
    transform:translateX(calc(-100% - 20px));
    transition:transform .32s cubic-bezier(.3,.8,.4,1);
    overflow-y:auto;
  }
  #panel.open{transform:none}
  /* Oppen redan i markup:en. En inglidning med backdrop-filter over en
     canvas som ritar om sig ar en garanterad hackning precis vid start. */
  #panel.noanim{transition:none}

  #toggle{
    position:fixed; z-index:5; left:14px; top:14px;
    height:50px; padding:0 18px; border-radius:14px;
    background:color-mix(in srgb, var(--chrome) 96%, transparent);
    border:2px solid var(--glow); color:var(--glow);
    box-shadow:0 0 18px color-mix(in srgb, var(--glow) 40%, transparent);
    backdrop-filter:blur(10px); cursor:pointer;
    display:flex; align-items:center; gap:9px;
    font:600 13px/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.14em;
  }
  #toggle b{font-size:18px; font-weight:400; line-height:1}
  @media (prefers-reduced-motion:reduce){ #panel{transition:none} }

  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .row button{
    flex:1 1 auto; min-width:78px; min-height:40px; padding:9px 6px;
    background:#151d22; border:1px solid var(--edge); border-radius:10px;
    color:var(--dim); font:600 11.5px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.13em; text-transform:uppercase; cursor:pointer;
    transition:color .16s, border-color .16s;
  }
  .row button:hover{color:var(--ink)}
  .row button.on{color:var(--glow); border-color:var(--glow); background:#1b2228}

  .sl{display:grid; grid-template-columns:82px 1fr 44px; align-items:center;
      gap:10px; margin-bottom:7px}
  .sl label{font:11px/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.15em;
            text-transform:uppercase; color:var(--dim)}
  .sl output{font:12px/1 ui-monospace,Menlo,monospace; color:var(--ink);
             text-align:right; font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:28px;
    background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--edge)}
  input[type=range]::-moz-range-track{height:2px; background:var(--edge)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--glow); margin-top:-8px; border:0;
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:var(--glow); border:0;
  }

  .hint{font:10.5px/1.5 ui-sans-serif,system-ui,sans-serif; letter-spacing:.05em;
        color:var(--dim); margin:-4px 0 14px}
  .foot{display:flex; align-items:center; gap:8px; margin-top:14px;
        padding-top:13px; border-top:1px solid var(--edge)}
  .foot span{margin-left:auto; font:11px/1 ui-monospace,Menlo,monospace;
             color:var(--dim); font-variant-numeric:tabular-nums}
  /* GitHub Pages skickar max-age=600 pa HTML och vi kan inte satta egna
     huvuden. Byggmarket gor darfor cachefragan till en blick i stallet
     for en felsokning: syns fel datum ar det en gammal kopia, punkt. */
  .build{margin:16px 0 0; font:10.5px/1 ui-monospace,Menlo,monospace;
         letter-spacing:.08em; color:#4d565b; text-align:right}
  .build b{font-weight:400; color:var(--dim)}

  @media (max-width:600px){
    /* Pa telefon ar en vansterdocka fel: bottenpanelen ar nara tummen. */
    #panel{
      left:12px; right:12px; width:auto; max-width:560px; margin:0 auto;
      top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
      max-height:calc(100vh - 92px); padding:14px 14px 16px;
      transform:translateY(calc(100% + 24px));
    }
    #panel.open{transform:none}
    #toggle{
      left:auto; right:14px; top:auto;
      bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
      width:62px; height:62px; padding:0; border-radius:50%;
      justify-content:center;
    }
    #toggle span{display:none}
    #title{top:14px; right:16px}
    .sl{grid-template-columns:74px 1fr 42px}
  }
</style>
<!-- Labbets gemensamma panelutseende. Laddas efter sidans egen style sa

<body>

<canvas id="c"></canvas>

<div id="title">

<button id="toggle" aria-label="Controls"><b>&#10042;</b><span>CONTROLS</span></button>

<div id="panel" class="open noanim">
  <div class="row" id="presets"></div>
  <p class="hint">Drag to turn it. Scroll or pinch to move closer.</p>

  <div class="sl"><label for="s-p">Winds</label><input type="range" id="s-p" min="1" max="9" step="1"><output id="o-p"></output></div>
  <div class="sl"><label for="s-q">Through</label><input type="range" id="s-q" min="0" max="11" step="1"><output id="o-q"></output></div>
  <div class="sl"><label for="s-u">Curl</label><input type="range" id="s-u" min="0" max="300" step="5"><output id="o-u"></output></div>

  <div class="sl"><label for="s-r">Spin</label><input type="range" id="s-r" min="0" max="40" step="1"><output id="o-r"></output></div>
  <div class="sl"><label for="s-f">Flow</label><input type="range" id="s-f" min="0" max="40" step="1"><output id="o-f"></output></div>
  <div class="sl"><label for="s-c">Drift</label><input type="range" id="s-c" min="-30" max="30" step="1"><output id="o-c"></output></div>
  <div class="sl"><label for="s-i">Invert</label><input type="range" id="s-i" min="0" max="40" step="1"><output id="o-i"></output></div>

  <div class="row" id="palettes" style="margin-top:14px; margin-bottom:0"></div>

  <p class="build">Build <b id="ver"></b></p>

  <div class="foot">
    <button id="shuffle" style="flex:0 0 auto; min-width:92px; min-height:38px; padding:9px 12px; background:#151d22; border:1px solid var(--edge); border-radius:10px; color:var(--dim); font:600 11.5px/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; cursor:pointer">Shuffle</button>
    <span id="hud">&mdash;</span>
  </div>
</div>

<script>
(function(){
"use strict";

const cvs = document.getElementById("c");
const gl = cvs.getContext("webgl2", { antialias:false, alpha:false, depth:true,
                                      powerPreference:"high-performance" });
if(!gl){
  document.body.innerHTML =
    '<p style="color:#7d888e;font:14px/1.6 system-ui;padding:40px;max-width:520px">' +
    'Coil needs WebGL2. Any browser from the last few years has it, so this is ' +
    'usually a graphics driver or a hardware acceleration setting.</p>';
  return;
}

const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════════
   Ingen geometri laddas upp. Punkterna finns inte i minnet: varje
   vertex raknar fram sin egen plats pa knuten ur gl_VertexID, sa
   CPU:n skickar bara ett tiotal tal per bildruta oavsett om det ar
   tjugotusen prickar eller trehundratusen.
   ═══════════════════════════════════════════════════════════════════ */
const VS = `#version 300 es
precision highp float;

uniform float u_nu, u_nv;      // rutnatets uppdelning: langs och runt
uniform float u_p, u_q;        // varv runt axeln, varv genom halet
uniform float u_twist;         // hur mycket tvarsnittet vrids per varv
uniform float u_sides;         // 0 = cirkel, annars regelbunden n-hörning
uniform float u_girth;         // rorets tjocklek
uniform float u_curl;          // radiens amplitud: over 2 viker kurvan inat
uniform float u_scale;         // haller formen lika stor i bild nar curl vaxer
uniform float u_flow;          // prickarnas vandring langs kurvan
uniform float u_drift;         // prickarnas vandring runt roret
uniform float u_invert;        // vinkeln pa fyrdimensionella vridningen
uniform mat3  u_rot;
uniform float u_aspect, u_focal, u_dist, u_size, u_dpr, u_psmax;

out float v_shade;
out float v_fog;
out float v_big;
out float v_lit;

const float TAU = 6.283185307179586;

// Mittlinjen och dess tangent i samma svep. Vid q = 0 ar det en vanlig
// ring, annars en (p,q)-torusknut som lindar sig p varv runt axeln och q
// varv genom halet.
//
// Tangenten deriveras analytiskt ur samma sinus och cosinus som
// positionen. Forut togs den numeriskt, vilket kravde tva extra anrop och
// alltsa tre ganger trigonometrin per prick. Samma svar, en tredjedel av
// arbetet, och ingen epsilon att valja fel.
void spine(float t, out vec3 c, out vec3 T, out vec2 ring){
  float cp = cos(u_p * t), sp = sin(u_p * t);
  float cq = cos(u_q * t), sq = sin(u_q * t);
  // Radien svanger kring 2 med amplituden u_curl. Vid 1 ar det den vanliga
  // knuten. Over 2 gar radien genom noll, kurvan passerar mitten och kommer
  // ut pa andra sidan, och bladen viker sig inat i stallet for utat.
  //
  // Ramen haller anda: den kan bara kollapsa om referensen blir parallell
  // med tangenten, vilket kraver bade cos(qt) = 0 och r = 0 samtidigt, och
  // de tva kan inte intraffa i samma punkt.
  float r = 2.0 + u_curl * cq, dr = -u_q * u_curl * sq;
  c = vec3(r * cp, r * sp, -sq);
  T = normalize(vec3(dr * cp - r * u_p * sp,
                     dr * sp + r * u_p * cp,
                     -u_q * cq));
  ring = vec2(cp, sp);
}

// Tvarsnittets radie vid vinkeln a. Ger 1 for cirkeln, annars avstandet
// ut till kanten pa en n-hörning med omskriven radie 1.
float section(float a, float n){
  if(n < 2.5) return 1.0;
  float k = 3.14159265 / n;
  return cos(k) / cos(mod(a, 2.0 * k) - k);
}

void main(){
  float id = float(gl_VertexID);
  float j  = mod(id, u_nv);            // varv runt roret
  float i  = (id - j) / u_nv;          // steg langs mittlinjen

  // Flodet ar en fasforskjutning, inte en ny form. Kurvan har perioden TAU,
  // sa hela rutnatet glider langs den yta det redan ligger pa: ytan star
  // still och prickarna vandrar in i sig sjalva. Vridningen foljer med i
  // t, sa pa en tvinnad knut korkskruvar de i stallet for att glida rakt.
  float t = i / u_nu * TAU + u_flow;
  float a = j / u_nv * TAU + u_twist * t + u_drift;

  vec3 c, T; vec2 ring;
  spine(t, c, T, ring);

  // Referensen ar lindningens radiella riktning, och den faller ut gratis
  // ur spine. Den ar aldrig parallell med tangenten pa en torusknut, sa
  // ramen kan inte kollapsa.
  vec3 ref = vec3(ring, 0.0);
  vec3 N = normalize(ref - T * dot(ref, T));
  vec3 B = cross(T, N);

  float rho = u_girth * section(a, u_sides);
  vec3 skin = N * cos(a) + B * sin(a);   // ytans normal, redan enhetslang
  vec3 pos = c + skin * rho;

  // Kroppens egen ljussattning, och skalet till att rullningen syns.
  //
  // Prickarna ligger jamnt runt roret, sa nar de roterar runt kroppen ar
  // rutnatet nastan identiskt med sig sjalvt och rorelsen forsvinner. Med
  // ett ljus som star still i RUMMET vandrar varje prick i stallet genom
  // det: en enskild parla tands nar den kommer upp och slocknar nar den
  // gar under. Det ar sa man ser att nagot rullar, i verkligheten ocksa.
  v_lit = 0.50 + 0.55 * max(0.0, dot(u_rot * skin, vec3(-0.35, 0.45, 0.82)));

  vec3 P3 = pos * u_scale;

  // ─────────────────────────────────────────────────────────────────
  // Ut och in i stallet for runt.
  //
  // Formen lyfts fran rummet upp pa en sfar i fyra dimensioner, vrids
  // dar, och slapps ner igen. En vridning i ett plan som ror den fjarde
  // axeln har ingen motsvarighet i rummet: den blir en inversion. Det
  // som lag innerst sveper ut genom ytan och blir ytterst, och det som
  // lag ytterst dras in genom mitten. Formen ar hela tiden densamma,
  // den ses bara fran ett hall som inte finns har.
  //
  // Vid vinkel noll ar det exakt identiteten, sa allt som fanns forut
  // star orort: 1 - w blir 2k, och 2vk delat med 2k ar v igen.
  // ─────────────────────────────────────────────────────────────────
  if(u_invert != 0.0){
    vec3 v = P3 / 2.4;                    // ner till enhetssfarens storlek
    float d2 = dot(v, v), k = 1.0 / (d2 + 1.0);
    vec3 xyz = 2.0 * v * k;               // upp pa sfaren
    float w = (d2 - 1.0) * k;
    float c = cos(u_invert), sn = sin(u_invert);
    float z2 = xyz.z * c - w * sn;        // vridningen i planet z mot w
    float w2 = xyz.z * sn + w * c;
    // Vid w = 1 star punkten i polen och skjuts oandligt langt bort.
    // Namnaren klamps, och det som anda flyger ivag tonas ut nedan.
    float den = 1.0 - w2;
    den = (den >= 0.0 ? 1.0 : -1.0) * max(abs(den), 0.03);
    P3 = vec3(xyz.x, xyz.y, z2) / den * 2.4;
  }

  vec3 pr = u_rot * P3;
  float z = pr.z + u_dist;
  float w = u_focal / max(0.35, z);

  // Djupet skrivs alltid, aven nar djuptestet ar av. Utan det kan de stora
  // kloten inte skymma varandra, och da ar de inte foremal utan flackar.
  gl_Position  = vec4(pr.x * w / u_aspect, pr.y * w,
                      clamp(z / 26.0, -1.0, 1.0), 1.0);
  // Taket kommer fran drivrutinen och ar inte samma overallt. Utan
  // klampningen slutar reglaget bara ta effekt vid nagon godtycklig punkt,
  // och pa vissa kort ritas ingenting alls over gransen.
  float ps = clamp(u_size * w * u_dpr, 1.0, u_psmax);
  gl_PointSize = ps;
  // Sma prickar ska vara mjuka gnistor, stora ska vara parlor. Fragmentet
  // far veta hur stort det blev och valjer sjalv.
  v_big = smoothstep(4.0, 9.0, ps);

  // Narmare = ljusare och varmare. Det ar hela djupkanslan: inga
  // skuggor, ingen djupbuffert, bara att bortre prickar tonas ner.
  float d = clamp((u_dist + 3.2 - z) / 6.4, 0.0, 1.0);
  v_shade = d;
  // Punkter som inversionen kastar ivag tonas ut i stallet for att flimra
  // i kanten. Utan inversion nar formen aldrig hit, sa det kostar inget.
  float esc = 1.0 - smoothstep(7.0, 16.0, length(P3));
  v_fog   = mix(0.10, 1.0, d * d) * esc;
}`;

const FS = `#version 300 es
precision highp float;
in float v_shade;
in float v_fog;
in float v_big;
in float v_lit;
uniform vec3 u_near, u_far;
uniform float u_solid;
out vec4 o;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d, d);
  if(r2 > 0.25) discard;

  // Normalen ur pricken sjalv: den ar redan enhetslang, sa klotet kostar
  // en rotutdragning.
  vec2 q = d * 2.0;
  float nz = sqrt(max(0.0, 1.0 - dot(q, q)));
  float lam = max(0.0, dot(vec3(q.x, -q.y, nz), vec3(-0.4364, 0.4909, 0.7545)));

  vec3 tint = mix(u_far, u_near, v_shade) * v_fog * v_lit;

  if(u_solid > 0.5){
    // Stora prickar: ogenomskinliga klot med djuptest, sa de skymmer
    // varandra. Det ar det som gor dem till foremal. Additivt ljus kan
    // aldrig bli fast materia, hur skarp kanten an ar, eftersom tva
    // genomskinliga gradienter som laggs ihop fortfarande ar genomskinliga.
    float spec = pow(lam, 30.0) * 0.9;
    vec3 col = tint * (0.55 + 0.62 * lam) + spec * mix(u_near, vec3(1.0), 0.6);
    // Kanten tonas over en dryg procent av radien. Mot en nastan svart
    // botten ar det kantutjamning och inte oskarpa.
    o = vec4(col * smoothstep(0.25, 0.2405, r2), 1.0);
  } else {
    // Sma prickar: additiva gnistor. Dar fram- och baksidan overlappar
    // adderas de och gar mot vitt, och det ar moirén, hela poangen med
    // punkter i stallet for en yta.
    float a = mix(smoothstep(0.25, 0.015, r2), smoothstep(0.25, 0.208, r2), v_big);
    o = vec4(tint * a * mix(1.0, 0.26 + 0.92 * lam, v_big), 1.0);
  }
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));

const U = {};
for(let i = 0, n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i < n; i++){
  const name = gl.getActiveUniform(prog, i).name;
  U[name] = gl.getUniformLocation(prog, name);
}
const vao = gl.createVertexArray();
const PS_MAX = Math.min(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 64, 512);

/* ═══════════════════════════════════════════════════════════════════
   Lage
   ═══════════════════════════════════════════════════════════════════ */
const BUILD = "2026-09-14";
$("ver").textContent = BUILD;

const P = { p:1, q:0, curl:1, twist:9, sides:0, girth:0.42, dots:52, size:19,
             spin:14, flow:10, drift:5, invert:0 };
const SIDES = [0, 3, 4, 5, 6, 8];
const SIDE_NAMES = ["○", "3", "4", "5", "6", "8"];

const PALETTES = [
  { name:"Ember", near:[1.00, 0.68, 0.30], far:[0.42, 0.16, 0.06] },
  { name:"Ice",   near:[0.62, 0.90, 1.00], far:[0.06, 0.20, 0.36] },
  { name:"Bloom", near:[1.00, 0.42, 0.52], far:[0.20, 0.08, 0.30] },
  { name:"Bone",  near:[0.94, 0.93, 0.88], far:[0.16, 0.20, 0.24] },
];
let pal = 0;

const PRESETS = [
  // Ormen som bitit sig sjalv: en sluten ring, tjock kropp, fa och stora
  // parlor, inget spinn. Da ar drift det enda som ror sig, och det syns
  // som att kroppen rullar runt sin egen axel.
  { name:"Ouroboros", p:1, q:0, curl:1.0, twist:0,  sides:0, girth:0.46, dots:5,  size:230, spin:0,  flow:0,  drift:26 },
  { name:"Ring",      p:1, q:0, curl:1.0, twist:0,  sides:0, girth:0.42, dots:52, size:19,  spin:14, flow:14, drift:0  },
  { name:"Twisted",   p:1, q:0, curl:1.0, twist:9,  sides:0, girth:0.42, dots:52, size:19,  spin:14, flow:10, drift:5  },
  { name:"Serpent",   p:1, q:6, curl:1.0, twist:2,  sides:0, girth:0.26, dots:58, size:16,  spin:6,  flow:22, drift:9  },
  { name:"Rosette",   p:1, q:5, curl:2.6, twist:0,  sides:0, girth:0.18, dots:46, size:22,  spin:8,  flow:14, drift:0  },
  { name:"Whorl",     p:2, q:7, curl:2.3, twist:3,  sides:0, girth:0.13, dots:62, size:14,  spin:5,  flow:20, drift:6  },
  { name:"Beads",     p:1, q:5, curl:2.4, twist:0,  sides:0, girth:0.16, dots:4,  size:250, spin:4,  flow:16, drift:7  },
  { name:"Trefoil",   p:2, q:3, curl:1.0, twist:0,  sides:0, girth:0.30, dots:52, size:19,  spin:14, flow:16, drift:4  },
  { name:"Spool",     p:3, q:2, curl:1.0, twist:4,  sides:0, girth:0.28, dots:52, size:19,  spin:14, flow:12, drift:7  },
  { name:"Forged",    p:1, q:0, curl:1.0, twist:16, sides:2, girth:0.46, dots:44, size:24,  spin:10, flow:6,  drift:0  },
];

// Vy
let yaw = 0.6, pitch = -0.42, dist = 8.4, autoYaw = 0;
// Faserna lindas mot TAU. Kurvan har den perioden, sa lindningen ar exakt
// och inte en approximation: utan den vaxer talet hela sessionen och
// flyttopplosningen ater sakta upp prickarnas placering.
const TAU = Math.PI * 2;
let flowPh = 0, driftPh = 0, invPh = 0;

/* ═══════════════════════════════════════════════════════════════════
   Duk
   ═══════════════════════════════════════════════════════════════════ */
let dpr = 1, W = 1, H = 1;
function resize(){
  // Kostnaden skalar med antal pixlar, sa taket sitter pa fonsterytan.
  // Satts en gang per storleksandring, aldrig ur bildfrekvensen.
  const area = Math.max(1, innerWidth * innerHeight);
  const budget = Math.min(1, Math.sqrt(2600000 / area));
  dpr = Math.min(devicePixelRatio || 1, 2) * budget;
  W = cvs.width  = Math.max(1, Math.round(innerWidth  * dpr));
  H = cvs.height = Math.max(1, Math.round(innerHeight * dpr));
  gl.viewport(0, 0, W, H);
}
addEventListener("resize", resize);
resize();

/* ═══════════════════════════════════════════════════════════════════
   Reglage
   ═══════════════════════════════════════════════════════════════════ */
function counts(){
  const d = P.dots / 100;
  // Runt roret racker det med far steg. Langs mittlinjen behovs manga,
  // och fler ju mer knuten lindar sig, annars glesnar prickarna dar
  // kurvan gar som fortast.
  const laps = Math.max(1, P.p) + Math.max(0, P.q) * 0.5;
  // Golvet gar hela vagen ner till EN prick per station, alltsa en enda
  // strang parlor tradd pa mittlinjen. Ett glest raster ar fortfarande ett
  // raster; ett parlband ar nagot annat, och det ar det som ska ga att na.
  const nv = Math.max(1, Math.round(d * 116));
  const nu = Math.round((18 + d * 1960) * Math.min(2.4, 0.55 + laps * 0.22));
  return { nu, nv, total: nu * nv };
}

function syncUI(){
  $("s-p").value = P.p;      $("o-p").textContent = P.p;
  $("s-q").value = P.q;      $("o-q").textContent = P.q;
  $("s-u").value = Math.round(P.curl * 100);
  $("o-u").textContent = Math.round(P.curl * 100) + "%";
  $("s-t").value = P.twist;  $("o-t").textContent = P.twist;
  $("s-s").value = P.sides;  $("o-s").textContent = SIDE_NAMES[P.sides];
  $("s-g").value = Math.round(P.girth * 100);
  $("o-g").textContent = Math.round(P.girth * 100) + "%";
  $("s-d").value = P.dots;   $("o-d").textContent = P.dots + "%";
  $("s-z").value = P.size;   $("o-z").textContent = P.size;
  $("s-r").value = P.spin;   $("o-r").textContent = P.spin;
  $("s-f").value = P.flow;   $("o-f").textContent = P.flow;
  $("s-c").value = P.drift;  $("o-c").textContent = P.drift;
  $("s-i").value = P.invert; $("o-i").textContent = P.invert;
  document.querySelectorAll("#palettes button").forEach((b, i) =>
    b.classList.toggle("on", i === pal));
}

function bind(id, out, key, read, write){
  const el = $(id);
  el.addEventListener("input", () => {
    P[key] = read(parseFloat(el.value));
    $(out).textContent = write(P[key]);
    document.querySelectorAll("#presets button").forEach(b => b.classList.remove("on"));
    queueHash();
  });
}
const same = v => v;
bind("s-p", "o-p", "p",     same, v => v);
bind("s-q", "o-q", "q",     same, v => v);
bind("s-u", "o-u", "curl",  v => v / 100, v => Math.round(v * 100) + "%");
bind("s-t", "o-t", "twist", same, v => v);
bind("s-s", "o-s", "sides", same, v => SIDE_NAMES[v]);
bind("s-g", "o-g", "girth", v => v / 100, v => Math.round(v * 100) + "%");
bind("s-d", "o-d", "dots",  same, v => v + "%");
bind("s-z", "o-z", "size",  same, v => v);
bind("s-r", "o-r", "spin",  same, v => v);
bind("s-f", "o-f", "flow",  same, v => v);
bind("s-c", "o-c", "drift", same, v => v);
bind("s-i", "o-i", "invert", same, v => v);

const presetRow = $("presets");
PRESETS.forEach((pre, i) => {
  const b = document.createElement("button");
  b.textContent = pre.name;
  b.onclick = () => {
    P.p = pre.p; P.q = pre.q; P.curl = pre.curl; P.twist = pre.twist;
    P.sides = pre.sides; P.girth = pre.girth;
    P.dots = pre.dots; P.size = pre.size;
    P.spin = pre.spin; P.flow = pre.flow; P.drift = pre.drift;
    syncUI();
    presetRow.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    queueHash();
  };
  if(i === 1) b.classList.add("on");
  presetRow.appendChild(b);
});

const palRow = $("palettes");
PALETTES.forEach((pl, i) => {
  const b = document.createElement("button");
  b.textContent = pl.name;
  b.onclick = () => { pal = i; syncUI(); queueHash(); };
  palRow.appendChild(b);
});

$("shuffle").onclick = () => {
  P.p = 1 + (Math.random() * 5 | 0);
  P.q = Math.random() < 0.3 ? 0 : 2 + (Math.random() * 6 | 0);
  P.twist = Math.random() < 0.5 ? 0 : (Math.random() * 18 | 0);
  P.sides = Math.random() < 0.6 ? 0 : (Math.random() * 6 | 0);
  P.girth = 0.10 + Math.random() * 0.34;
  P.curl = Math.random() < 0.45 ? 1 : 1.6 + Math.random() * 1.4;
  if(Math.random() < 0.25){ P.dots = 2 + (Math.random() * 9 | 0); P.size = 120 + (Math.random() * 220 | 0); }
  P.flow = 6 + (Math.random() * 26 | 0);
  P.drift = (Math.random() * 21 | 0) - 10;
  syncUI();
  presetRow.querySelectorAll("button").forEach(x => x.classList.remove("on"));
  queueHash();
};

/* ═══════════════════════════════════════════════════════════════════
   Laget bor i adressfaltet.
   Formerna hittas for hand, och utan det har finns det ingen vag
   tillbaka till en man gillade: en fin knut ar tolv reglage man inte
   kommer ihag. Nu ar den en lank som gar att bokmarka och skicka.
   Kameran star medvetet utanfor: den andras hela tiden medan man drar,
   och det ar formen som ar vard att spara, inte vinkeln.
   ═══════════════════════════════════════════════════════════════════ */
const HASH_KEYS = ["p","q","curl","twist","sides","girth","dots","size",
                   "spin","flow","drift","invert"];
const HASH_PCT = { curl:1, girth:1 };   // lagras som heltalsprocent
let hashTimer = 0;

function writeHash(){
  const v = HASH_KEYS.map(k => HASH_PCT[k] ? Math.round(P[k] * 100) : P[k]);
  v.push(pal);
  // replaceState och inte location.hash: annars far man en historikpost
  // per reglagesteg och bakatknappen blir oanvandbar.
  history.replaceState(null, "", "#" + v.join(","));
}
function queueHash(){
  clearTimeout(hashTimer);
  hashTimer = setTimeout(writeHash, 260);
}
function readHash(){
  const raw = decodeURIComponent(location.hash.slice(1));
  if(!raw) return false;
  const v = raw.split(",").map(Number);
  if(v.length < HASH_KEYS.length || v.some(x => !isFinite(x))) return false;
  HASH_KEYS.forEach((k, i) => { P[k] = HASH_PCT[k] ? v[i] / 100 : v[i]; });
  if(v.length > HASH_KEYS.length)
    pal = clamp(Math.round(v[HASH_KEYS.length]), 0, PALETTES.length - 1);
  // Varje varde klamps mot sitt reglage. En lank ar text nagon annan kan
  // ha skrivit, sa den far inte kunna satta formen i ett omojligt lage.
  P.p      = clamp(Math.round(P.p), 1, 9);
  P.q      = clamp(Math.round(P.q), 0, 11);
  P.curl   = clamp(P.curl, 0, 3);
  P.twist  = clamp(Math.round(P.twist), 0, 24);
  P.sides  = clamp(Math.round(P.sides), 0, SIDES.length - 1);
  P.girth  = clamp(P.girth, 0.04, 0.9);
  P.dots   = clamp(Math.round(P.dots), 1, 100);
  P.size   = clamp(Math.round(P.size), 4, 420);
  P.spin   = clamp(Math.round(P.spin), 0, 40);
  P.flow   = clamp(Math.round(P.flow), 0, 40);
  P.drift  = clamp(Math.round(P.drift), -30, 30);
  P.invert = clamp(Math.round(P.invert), 0, 40);
  return true;
}

const panel = $("panel"), toggle = $("toggle"), toggleLbl = toggle.querySelector("span");
toggle.onclick = () => {
  toggleLbl.textContent = panel.classList.toggle("open") ? "HIDE" : "CONTROLS";
};
toggleLbl.textContent = "HIDE";
requestAnimationFrame(() => panel.classList.remove("noanim"));

/* ═══════════════════════════════════════════════════════════════════
   Dra och zooma
   ═══════════════════════════════════════════════════════════════════ */
const pointers = new Map();
let dragging = false, lastX = 0, lastY = 0, pinch = 0, idle = 0;

cvs.addEventListener("pointerdown", e => {
  cvs.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pointers.size === 1){ dragging = true; lastX = e.clientX; lastY = e.clientY; }
  else if(pointers.size === 2) pinch = spread();
  idle = 0;
});
cvs.addEventListener("pointermove", e => {
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  idle = 0;
  if(pointers.size === 2){
    const s = spread();
    if(pinch > 0) dist = clamp(dist * (pinch / s), 4.2, 22);
    pinch = s;
    return;
  }
  if(!dragging) return;
  yaw   += (e.clientX - lastX) * 0.006;
  pitch += (e.clientY - lastY) * 0.006;
  pitch = clamp(pitch, -1.45, 1.45);
  lastX = e.clientX; lastY = e.clientY;
});
function release(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = 0;
  if(pointers.size === 0) dragging = false;
}
cvs.addEventListener("pointerup", release);
cvs.addEventListener("pointercancel", release);
cvs.addEventListener("wheel", e => {
  e.preventDefault();
  dist = clamp(dist * (1 + Math.sign(e.deltaY) * 0.09), 4.2, 22);
}, { passive:false });

function spread(){
  const v = [...pointers.values()];
  return Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

/* ═══════════════════════════════════════════════════════════════════
   Rita
   ═══════════════════════════════════════════════════════════════════ */
gl.clearColor(0.024, 0.031, 0.039, 1);
gl.blendFunc(gl.ONE, gl.ONE);   // additiv: overlapp lyser, ingen sortering behovs

// Vrid runt Y, sen runt X. Kolumnordning, som GLSL vill ha den.
// Autospinnet laggs pa yaw utan att rora det anvandaren dragit till.
const rot = new Float32Array(9);
function buildRot(){
  const ay = yaw + autoYaw;
  const cy = Math.cos(ay),    sy = Math.sin(ay);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  rot[0] = cy;  rot[1] =  sy * sp;  rot[2] = -sy * cp;
  rot[3] = 0;   rot[4] =  cp;       rot[5] =  sp;
  rot[6] = sy;  rot[7] = -cy * sp;  rot[8] =  cy * cp;
}

const hud = $("hud");
let last = performance.now(), frames = 0, acc = 0;

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  if(!dragging){
    idle += dt;
    // Spinnet tar over mjukt nar handen slappt, sa den aldrig rycker igang.
    autoYaw += P.spin * 0.0022 * Math.min(1, idle * 1.6);
  }
  flowPh  = (flowPh  + P.flow  * 0.07 * dt) % TAU;
  driftPh = (driftPh + P.drift * 0.07 * dt) % TAU;
  // Vid noll ar vinkeln inte bara stillastaende utan pa vag hem. Annars
  // skulle en avstangd inversion lamna formen frusen halvvags utvand,
  // utan nagot satt att ta sig tillbaka.
  if(P.invert > 0) invPh = (invPh + P.invert * 0.035 * dt) % TAU;
  else if(invPh !== 0){
    const step = 1.6 * dt;
    const home = invPh > Math.PI ? TAU : 0;
    invPh = Math.abs(home - invPh) <= step ? 0 : invPh + Math.sign(home - invPh) * step;
  }

  buildRot();
  const c = counts();
  const pl = PALETTES[pal];

  // Punktstorleken raknas fram har med samma formel som i shadern, sa
  // valet av lage och shaderns egen mjuka overgang foljs at.
  const ps = P.size * 0.26 * (3.9 / Math.max(0.35, dist)) * dpr;
  const solid = ps > 7;
  if(solid){ gl.enable(gl.DEPTH_TEST); gl.disable(gl.BLEND); }
  else     { gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); }

  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);

  gl.uniform1f(U.u_nu, c.nu);
  gl.uniform1f(U.u_nv, c.nv);
  gl.uniform1f(U.u_p, P.p);
  gl.uniform1f(U.u_q, P.q);
  gl.uniform1f(U.u_twist, P.twist);
  gl.uniform1f(U.u_sides, SIDES[P.sides]);
  gl.uniform1f(U.u_girth, P.girth);
  gl.uniform1f(U.u_curl, P.curl);
  // Radien nar ut till 2 + curl, sa utan detta vaxer formen ur bild sa fort
  // curl hojs. Referensen ar curl = 1, dar skalan blir exakt 1.
  gl.uniform1f(U.u_scale, (3 + P.girth) / (2 + P.curl + P.girth));
  gl.uniform1f(U.u_flow, flowPh);
  gl.uniform1f(U.u_drift, driftPh);
  gl.uniform1f(U.u_invert, invPh % TAU);
  gl.uniform1f(U.u_aspect, W / Math.max(1, H));
  gl.uniform1f(U.u_focal, 3.9);
  gl.uniform1f(U.u_dist, dist);
  gl.uniform1f(U.u_size, P.size * 0.26);
  gl.uniform1f(U.u_dpr, dpr);
  gl.uniform1f(U.u_psmax, PS_MAX);
  gl.uniform1f(U.u_solid, solid ? 1 : 0);
  gl.uniform3f(U.u_near, pl.near[0], pl.near[1], pl.near[2]);
  gl.uniform3f(U.u_far,  pl.far[0],  pl.far[1],  pl.far[2]);

  gl.uniformMatrix3fv(U.u_rot, false, rot);

  gl.drawArrays(gl.POINTS, 0, c.total);
  gl.bindVertexArray(null);

  frames++; acc += dt;
  if(acc > 0.5){
    // Lagesbytet sitter i prickstorleken och ar avsiktligt, men utan att
    // det star nagonstans ser det ut som att sidan hittar pa saker sjalv.
    hud.textContent = (c.total / 1000 | 0) + "k · " +
                      Math.round(frames / acc) + " fps · " +
                      (solid ? "solid" : "glow");
    frames = 0; acc = 0;
  }
}

if(readHash())
  presetRow.querySelectorAll("button").forEach(x => x.classList.remove("on"));
syncUI();
requestAnimationFrame(t => { last = t; loop(t); });

})();
</script>
